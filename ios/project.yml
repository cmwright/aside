name: Aside

options:
  bundleIdPrefix: com.codywright
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  # The keyboard extension deliberately does not depend on this: FluidAudio pulls in
  # CoreML and a binary framework, and a keyboard is killed above ~50 MB.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.12.4"

# Signing comes from Signing.xcconfig (git-ignored; see Signing.xcconfig.example).
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.3"
    CURRENT_PROJECT_VERSION: "8"
    # Device installs need an Xcode-managed profile: the App Group capability has to be
    # registered with Apple, and Xcode does that by itself only in Automatic mode.
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    # iPhone only. Parakeet needs the Neural Engine and FluidAudio's Float16 paths do not
    # build for anything but arm64.
    TARGETED_DEVICE_FAMILY: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "YES"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

targets:
  Aside:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
      # The Control Center intent, compiled into the app as well as the control extension.
      - path: Intents
      # Shared with the Mac app by reference, never copied. See PLAN-iOS.md.
      - path: ../mac/Sources/Log.swift
      - path: ../mac/Sources/Settings.swift
      - path: ../mac/Sources/CleanupLevel.swift
      - path: ../mac/Sources/Trigger.swift
      - path: ../mac/Sources/Dictionary.swift
      - path: ../mac/Sources/DictionaryReplacer.swift
      - path: ../mac/Sources/CleanupPrompt.swift
      - path: ../mac/Sources/History.swift
      - path: ../mac/Sources/AppleCleanup.swift
      - path: ../mac/Sources/LocalTranscriber.swift
      # WAV writer and the realtime PCM sink both recorders are built on.
      - path: ../mac/Sources/PCMCapture.swift
      # Direct providers: an OpenAI-compatible endpoint called straight from the phone,
      # with the key in the keychain.
      - path: ../mac/Sources/Providers.swift
      - path: ../mac/Sources/APIKeyStore.swift
      - path: ../mac/Sources/DirectClient.swift
    dependencies:
      - package: FluidAudio
      - target: AsideMessages
        embed: true
        codeSign: true
      - target: AsideKeyboard
        embed: true
        codeSign: true
      - target: AsideControl
        embed: true
        codeSign: true
    entitlements:
      path: Aside.entitlements
      # xcodegen rewrites the file from these on every run.
      properties:
        com.apple.security.application-groups:
          - group.com.codywright.aside
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codywright.aside.ios
        PRODUCT_NAME: Aside
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Aside
        CFBundleDisplayName: Aside
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # The keyboard opens aside://session/start to get a session going.
        CFBundleURLTypes:
          - CFBundleURLName: com.codywright.aside.ios
            CFBundleURLSchemes: [aside]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait-only is fine for an iPhone app, but App Store validation (error 90474)
        # insists on all four orientations unless the app declares it never multitasks.
        UIRequiresFullScreen: true
        # Keeping the audio engine running is what lets a session survive the app going to
        # the background, which is the whole point of "Start Session".
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Aside records your voice while you hold the mic button, and transcribes it on this iPhone or at the provider you chose."
        # Bundled, OFL-licensed: the word mark.
        UIAppFonts: [BarlowCondensed-SemiBold.ttf]

  AsideKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: Keyboard/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
      # The gesture state machine, shared with the Mac trigger. Foundation only.
      - path: ../mac/Sources/Trigger.swift
      # Colours, fonts, the glyph and the meter ring; SwiftUI only.
      - path: App/Theme.swift
      - path: App/Fonts
        buildPhase: resources
    entitlements:
      path: AsideKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.codywright.aside
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codywright.aside.ios.keyboard
        PRODUCT_NAME: AsideKeyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleName: Aside
        CFBundleDisplayName: Aside
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            # Full Access is what makes the App Group readable from the extension; without
            # it the keyboard can only tell the user to switch it on.
            RequestsOpenAccess: true
            PrimaryLanguage: en-US
            IsASCIICapable: false
            PrefersRightToLeft: false
        UIAppFonts: [BarlowCondensed-SemiBold.ttf]

  AsideMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: Messages
        excludes: [Info.plist]
      - path: Shared
      - path: App/SessionRecorder.swift
      - path: ../mac/Sources/PCMCapture.swift
      - path: ../mac/Sources/LocalTranscriber.swift
      - path: App/Theme.swift
      - path: App/Fonts
        buildPhase: resources
      - path: ../mac/Sources/CleanupLevel.swift
      - path: ../mac/Sources/Dictionary.swift
      - path: ../mac/Sources/DictionaryReplacer.swift
      - path: ../mac/Sources/CleanupPrompt.swift
      - path: ../mac/Sources/AppleCleanup.swift
      - path: ../mac/Sources/Log.swift
    dependencies:
      - package: FluidAudio
      - sdk: Messages.framework
    entitlements:
      path: AsideMessages.entitlements
      properties:
        com.apple.security.application-groups: [group.com.codywright.aside]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codywright.aside.ios.messages
        PRODUCT_NAME: AsideMessages
        INFOPLIST_FILE: Messages/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: Messages/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Aside records your voice in Messages and transcribes it on this iPhone."
        CFBundleName: Aside
        CFBundleDisplayName: Aside
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [BarlowCondensed-SemiBold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController

  AsideControl:
    type: app-extension
    platform: iOS
    # The control's intent needs the iOS 26 "dynamic foreground" mode to open the app only
    # when no session is running. The app itself still runs on 17; there the extension is
    # simply never loaded.
    deploymentTarget: "26.0"
    sources:
      - path: Control
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: Control/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
      - path: Intents
    entitlements:
      path: AsideControl.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.codywright.aside
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codywright.aside.ios.control
        PRODUCT_NAME: AsideControl
        INFOPLIST_FILE: Control/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: Control/Info.plist
      properties:
        CFBundleName: Aside
        CFBundleDisplayName: Aside
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Simulator-only: drives Safari + the Aside keyboard to check the keyboard can open the
  # app. Run with: xcodebuild test -scheme Aside -only-testing:AsideUITests -destination ...
  AsideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Aside
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codywright.aside.ios.uitests
        TEST_TARGET_NAME: Aside
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Aside:
    build:
      targets:
        Aside: all
        AsideKeyboard: all
        AsideControl: all
        AsideUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AsideUITests
    archive:
      config: Release
