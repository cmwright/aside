name: Aside

options:
  bundleIdPrefix: com.codywright
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.12.4"

# Signing comes from Signing.xcconfig (git-ignored; see Signing.xcconfig.example).
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    # Apple Silicon only: on-device Parakeet needs the Neural Engine, and FluidAudio's
    # Float16 paths do not compile for x86_64.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "YES"
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "$(DEBUG_SIGN_IDENTITY)"
      ENABLE_HARDENED_RUNTIME: "NO"
    Release:
      CODE_SIGN_IDENTITY: "$(RELEASE_SIGN_IDENTITY)"
      ENABLE_HARDENED_RUNTIME: "YES"

targets:
  Aside:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: FluidAudio
    # Only the microphone entitlement, which the Hardened Runtime requires. App Sandbox
    # stays OFF: the Accessibility API and global event monitors do not work sandboxed.
    entitlements:
      path: Aside.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codywright.aside
        PRODUCT_NAME: Aside
        ENABLE_APP_SANDBOX: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: Info.plist
      properties:
        CFBundleName: Aside
        CFBundleIconFile: AppIcon
        CFBundleDisplayName: Aside
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu-bar only: no Dock icon, no main window.
        LSUIElement: true
        NSHumanReadableCopyright: "MIT licensed."
        NSMicrophoneUsageDescription: "Aside records your voice while you hold the dictation key, and transcribes it on this Mac or at the backend you configured."
        NSAppleEventsUsageDescription: "Aside does not send Apple Events; this key is present only so macOS never shows an empty prompt."
        # Accessibility has no Info.plist usage-description key. It is requested at
        # runtime with AXIsProcessTrustedWithOptions and explained in Permissions.
        VTTAccessibilityUsageDescription: "Aside needs Accessibility access to notice when you hold the dictation key and to insert the transcribed text at your cursor."

  AsideTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Aside
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codywright.aside.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Aside:
    build:
      targets:
        Aside: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AsideTests
