name: VoiceToText

options:
  bundleIdPrefix: com.codywright
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.12.4"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
    ALWAYS_SEARCH_USER_PATHS: "NO"

targets:
  VoiceToText:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: KeyboardShortcuts
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codywright.voicetotext
        PRODUCT_NAME: VoiceToText
        # App Sandbox is intentionally OFF: the Accessibility API and global event
        # monitors do not work from a sandboxed app. No entitlements file is used.
        ENABLE_APP_SANDBOX: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: Info.plist
      properties:
        CFBundleName: VoiceToText
        CFBundleDisplayName: VoiceToText
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu-bar only: no Dock icon, no main window.
        LSUIElement: true
        NSHumanReadableCopyright: "MIT licensed."
        NSMicrophoneUsageDescription: "VoiceToText records your voice while you hold the dictation key, and transcribes it on this Mac or at the backend you configured."
        NSAppleEventsUsageDescription: "VoiceToText does not send Apple Events; this key is present only so macOS never shows an empty prompt."
        # Accessibility has no Info.plist usage-description key. It is requested at
        # runtime with AXIsProcessTrustedWithOptions and explained in Permissions.
        VTTAccessibilityUsageDescription: "VoiceToText needs Accessibility access to notice when you hold the dictation key and to insert the transcribed text at your cursor."

  VoiceToTextTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: VoiceToText
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codywright.voicetotext.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  VoiceToText:
    build:
      targets:
        VoiceToText: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VoiceToTextTests
