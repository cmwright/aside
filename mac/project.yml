name: Aside

options:
  bundleIdPrefix: com.codywright
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.12.4"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"

# Signing comes from Signing.xcconfig (git-ignored; see Signing.xcconfig.example).
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    # Apple Silicon only: on-device Parakeet needs the Neural Engine, and FluidAudio's
    # Float16 paths do not compile for x86_64.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "YES"
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "$(DEBUG_SIGN_IDENTITY)"
      ENABLE_HARDENED_RUNTIME: "NO"
    Release:
      CODE_SIGN_IDENTITY: "$(RELEASE_SIGN_IDENTITY)"
      ENABLE_HARDENED_RUNTIME: "YES"
      # Notarization rejects apps carrying the debugger entitlement.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
      # Notarization also requires a secure timestamp, which a plain build does not add.
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

targets:
  Aside:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: FluidAudio
      - package: Sparkle
    # Only the microphone entitlement, which the Hardened Runtime requires. App Sandbox
    # stays OFF: the Accessibility API and global event monitors do not work sandboxed.
    entitlements:
      path: Aside.entitlements
      # xcodegen regenerates the file from these on every run; an entry without
      # properties would overwrite it with an empty dict.
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codywright.aside
        PRODUCT_NAME: Aside
        ENABLE_APP_SANDBOX: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: Info.plist
      properties:
        CFBundleName: Aside
        CFBundleIconFile: AppIcon
        # Sparkle updates. The appcast is published as a GitHub Release asset by mac/publish.sh;
        # the public key pairs with the EdDSA private key in the release machine's keychain.
        SUFeedURL: https://github.com/cmwright/aside/releases/latest/download/appcast.xml
        SUPublicEDKey: NUP11ESWdzmTd6Ubed5HlpaRHw7Vr7FqGMtlx8t2Pmc=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        CFBundleDisplayName: Aside
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu-bar only: no Dock icon, no main window.
        LSUIElement: true
        NSHumanReadableCopyright: "MIT licensed."
        NSMicrophoneUsageDescription: "Aside records your voice while you hold the dictation key, and transcribes it on this Mac or at the backend you configured."
        NSAppleEventsUsageDescription: "Aside does not send Apple Events; this key is present only so macOS never shows an empty prompt."
        # Accessibility has no Info.plist usage-description key. It is requested at
        # runtime with AXIsProcessTrustedWithOptions and explained in Permissions.
        VTTAccessibilityUsageDescription: "Aside needs Accessibility access to notice when you hold the dictation key and to insert the transcribed text at your cursor."

  AsideTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # The iPhone hand-off protocol is Foundation-only and has no simulator to run in,
      # so it is compiled into this target and tested here. See PLAN-iOS.md.
      - path: ../ios/Shared
      - path: ../ios/Tests
    dependencies:
      - target: Aside
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codywright.aside.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Aside:
    build:
      targets:
        Aside: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AsideTests
